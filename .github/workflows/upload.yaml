name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate

    - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"

    - name: Install and validate
      run: |
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        calcit calcit.cirru test --require-match --summary-only --format json
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru

    - name: Build and regression tests
      run: |
        yarn build
        node --test scripts/upgrade.test.mjs

    - name: Install verified rsync
      run: |
        set -euo pipefail
        curl --fail --location --silent --show-error \
          --output "$RUNNER_TEMP/rsync.tar.gz" \
          https://download.samba.org/pub/rsync/src/rsync-3.5.0.tar.gz
        echo "c7ffd1ef653e99540f661e47cb00b7f9cad1ee6b972399b16f93d672656e0d33  $RUNNER_TEMP/rsync.tar.gz" | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/rsync.tar.gz" -C "$RUNNER_TEMP"
        cd "$RUNNER_TEMP/rsync-3.5.0"
        ./configure \
          --prefix="$RUNNER_TEMP/rsync-install" \
          --disable-acl-support \
          --disable-lz4 \
          --disable-openssl \
          --disable-xattr-support \
          --disable-xxhash \
          --disable-zstd
        make -j2
        make install
        echo "$RUNNER_TEMP/rsync-install/bin" >> "$GITHUB_PATH"

    - name: Configure verified SSH host
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        DEPLOY_KEY: ${{ secrets.rsync_private_key }}
      run: |
        set -euo pipefail
        install -m 700 -d "$HOME/.ssh"
        printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
        chmod 600 "$HOME/.ssh/deploy_key"
        printf '%s\n' 'tiye.me ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINfDrFyoH0+6TL2+xhosnON6f0+/m9Iz8ydJLWMQQzsm' > "$HOME/.ssh/known_hosts"
        chmod 600 "$HOME/.ssh/known_hosts"

    - name: Deploy web assets
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        set -euo pipefail
        rsync -avzr --progress \
          -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
          dist/* "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

    # Shadow upload runs after the existing production deployment.
    - name: Select COS prefix
      id: cos-path
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          echo "prefix=${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/" >> "$GITHUB_OUTPUT"
        else
          echo "prefix=${GITHUB_REPOSITORY}/" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload static assets to COS
      if: steps.cos-path.outcome == 'success'
      uses: worktools/cos-upload-action@0ce57b26b03dbdd27a4a544a06d453415932c62d # v1.0.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.cos-path.outputs.prefix }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Verify uploaded page through public CDN
      if: steps.cos-path.outcome == 'success'
      env:
        COS_ASSET_PREFIX: ${{ steps.cos-path.outputs.prefix }}
      run: |
        for attempt in 1 2 3 4 5 6; do
          if curl --fail --location --retry 2 --retry-delay 2 --retry-all-errors \
            "https://cos-sh.tiye.me/${COS_ASSET_PREFIX}index.html?run=${GITHUB_RUN_ID}-${attempt}" \
            --output "$RUNNER_TEMP/cos-index.html" && \
            cmp -s dist/index.html "$RUNNER_TEMP/cos-index.html"; then
            echo "CDN index.html matches dist/index.html on attempt ${attempt}"
            exit 0
          fi
          sleep 2
        done
        echo 'CDN index.html did not match dist/index.html after 6 attempts' >&2
        exit 1
